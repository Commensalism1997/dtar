[package]
name = "dtar"
version = "0.1.0"
authors = ["Commensalism"]
description = "CLI tarball archiving utility with progress indicators"
readme = "README.md"
repository = "https://github.com/Commensalism1997/dtar"
license = "GPL-3.0-or-later"
keywords = ["tar", "archive", "progress"]
categories = ["command-line-utilities", "compression", "encoding"]
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
flate2 = "1.1.9"
indicatif = "0.18.4"
tar = "0.4.45"
xz2 = "0.1.7"
zstd = "0.13.3"
